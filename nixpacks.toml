[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[phases.post-build]
cmds = [
  "echo '🚀 [RAILWAY] Iniciando migraciones de Prisma...'",
  "npx prisma migrate deploy --skip-generate",
  "echo '✅ [RAILWAY] Migraciones completadas exitosamente'"
]

[start]
cmd = "npm run start:railway"
